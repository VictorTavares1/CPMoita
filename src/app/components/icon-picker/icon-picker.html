<div class="position-relative">
  <label class="form-label">Ícone <span class="text-danger">*</span></label>

  <div class="input-group">
    <span class="input-group-text" style="width: 42px; justify-content: center;">
      @if (value) {
        <i [class]="value"></i>
      } @else {
        <i class="fa-solid fa-icons text-muted"></i>
      }
    </span>
    <input type="text" class="form-control" readonly
      [value]="selectedLabel"
      placeholder="Clique para escolher um ícone"
      style="cursor: pointer; background: #fff;"
      (click)="toggle()">
    <button type="button" class="btn btn-outline-secondary" (click)="toggle()">
      <i class="fa-solid" [class]="open ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
    </button>
  </div>

  @if (open) {
    <div class="icon-picker-dropdown shadow">
      <div class="icon-picker-grid">
        @for (icon of icons; track icon.class) {
          <button type="button" class="icon-picker-btn"
            [class.selected]="value === icon.class"
            (click)="select(icon.class)"
            [title]="icon.label">
            <i [class]="icon.class"></i>
            <span>{{ icon.label }}</span>
          </button>
        }
      </div>
    </div>
  }
</div>
