<div>
  <div class="d-flex align-items-center gap-2 mb-4">
    <a routerLink="/admin/orgaos-sociais" class="btn btn-outline-secondary btn-sm">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h4 class="mb-0 fw-semibold">Editar Membro</h4>
  </div>

  @if (error()) {
    <div class="alert alert-danger py-2 small">{{ error() }}</div>
  }

  @if (loading()) {
    <div class="text-center py-5 text-muted">
      <span class="spinner-border spinner-border-sm me-2"></span>A carregar...
    </div>
  } @else {
    <div class="card border-0 shadow-sm">
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label">Secção <span class="text-danger">*</span></label>
          <select class="form-select" [(ngModel)]="secao">
            <option value="direcao">Direção</option>
            <option value="conselho_fiscal">Conselho Fiscal</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Cargo <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="cargo" placeholder="Ex: Presidente, Secretária, Vogal">
        </div>

        <div class="mb-4">
          <label class="form-label">Nome <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="nome" placeholder="Nome completo">
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
            @if (saving()) { <span class="spinner-border spinner-border-sm me-1"></span> }
            Guardar
          </button>
          <a routerLink="/admin/orgaos-sociais" class="btn btn-outline-secondary">Cancelar</a>
        </div>

      </div>
    </div>
  }
</div>
