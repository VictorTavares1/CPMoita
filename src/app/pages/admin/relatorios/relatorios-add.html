<div>
  <div class="d-flex align-items-center gap-3 mb-4">
    <a routerLink="/admin/relatorios" class="btn btn-outline-secondary btn-sm">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h4 class="mb-0 fw-semibold">Inserir Relatório</h4>
  </div>

  @if (error()) {
    <div class="alert alert-danger py-2 small">{{ error() }}</div>
  }

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="titulo" placeholder="Ex: Balanço 2024">
        </div>

        <div class="col-md-2">
          <label class="form-label fw-semibold">Ano <span class="text-danger">*</span></label>
          <input type="number" class="form-control" [(ngModel)]="ano" min="2000" max="2099">
        </div>

        <div class="col-md-4">
          <label class="form-label fw-semibold">Ficheiro (PDF/Word) <span class="text-danger">*</span></label>
          <input type="file" class="form-control" id="docInput" accept=".pdf,.doc,.docx">
        </div>

        <div class="col-12 d-flex gap-2 justify-content-end">
          <a routerLink="/admin/relatorios" class="btn btn-outline-secondary">Cancelar</a>
          <button class="btn btn-primary" (click)="submit()" [disabled]="loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-1"></span>
            }
            Inserir Relatório
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
