<div>
  <div class="d-flex align-items-center gap-2 mb-4">
    <h4 class="mb-0 fw-semibold"><i class="fa-solid fa-user-circle me-2"></i>O Meu Perfil</h4>
  </div>

  @if (loading()) {
    <div class="text-center py-5 text-muted">
      <span class="spinner-border spinner-border-sm me-2"></span>A carregar...
    </div>
  } @else {
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label text-muted small">Email</label>
          <p class="fw-semibold mb-0">{{ email }}</p>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <h5 class="fw-semibold mb-3">Alterar Palavra-passe</h5>

        @if (error()) {
          <div class="alert alert-danger py-2 small">{{ error() }}</div>
        }
        @if (success()) {
          <div class="alert alert-success py-2 small">{{ success() }}</div>
        }

        <div class="mb-3">
          <label class="form-label">Palavra-passe atual <span class="text-danger">*</span></label>
          <input type="password" class="form-control" [(ngModel)]="pwdAtual" autocomplete="current-password">
        </div>

        <div class="mb-3">
          <label class="form-label">Nova palavra-passe <span class="text-danger">*</span></label>
          <input type="password" class="form-control" [(ngModel)]="novaPwd" autocomplete="new-password">
          <div class="form-text">Mínimo 8 caracteres, 1 maiúscula, 1 número e 1 caractere especial (!@#$%...).</div>
        </div>

        <div class="mb-4">
          <label class="form-label">Confirmar nova palavra-passe <span class="text-danger">*</span></label>
          <input type="password" class="form-control" [(ngModel)]="confirmarPwd" autocomplete="new-password">
        </div>

        <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
          @if (saving()) { <span class="spinner-border spinner-border-sm me-1"></span> }
          Guardar alterações
        </button>
      </div>
    </div>
  }
</div>
