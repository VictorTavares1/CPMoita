<div>
  <div class="d-flex align-items-center gap-2 mb-4">
    <a routerLink="/admin/paginas" class="btn btn-outline-secondary btn-sm">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h4 class="mb-0 fw-semibold">Editar Conteúdo</h4>
  </div>

  @if (loading()) {
    <div class="text-center py-5 text-muted">
      <span class="spinner-border spinner-border-sm me-2"></span>A carregar...
    </div>
  } @else {
    @if (error()) {
      <div class="alert alert-danger py-2 small">{{ error() }}</div>
    }

    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label small text-muted">Página</label>
            <p class="fw-semibold mb-0">{{ pagina }}</p>
          </div>
          <div class="col-md-4">
            <label class="form-label small text-muted">Chave</label>
            <p class="fw-semibold mb-0">{{ chave }}</p>
          </div>
          <div class="col-md-4">
            <label class="form-label small text-muted">Tipo</label>
            <p class="mb-0"><span class="badge bg-secondary">{{ tipo }}</span></p>
          </div>
        </div>

        <hr>

        @if (tipo === 'link') {
          <div class="mb-3">
            <label class="form-label">Texto do Link</label>
            <input type="text" class="form-control" [(ngModel)]="linkLabel" placeholder="ex: Consulte aqui os estatutos">
          </div>
          <div class="mb-4">
            <label class="form-label">Ficheiro</label>
            @if (linkFilename) {
              <div class="mb-2">
                <a [href]="docsUrl + linkFilename" target="_blank" class="small text-primary">
                  <i class="fa-solid fa-file me-1"></i>{{ linkFilename }}
                </a>
              </div>
            }
            <label class="btn btn-outline-secondary btn-sm">
              <i class="fa-solid fa-upload me-1"></i>Escolher ficheiro
              <input type="file" class="d-none" accept=".pdf,.doc,.docx" (change)="uploadDoc($event)">
            </label>
          </div>
        } @else if (tipo === 'text') {
          <div class="mb-4">
            <label class="form-label">Conteúdo</label>
            <input type="text" class="form-control" [(ngModel)]="conteudoPagina">
          </div>
        } @else {
          <div class="mb-4">
            <label class="form-label">Conteúdo</label>
            <div id="pagina-editor" style="min-height: 150px;"></div>
          </div>
        }

        <div class="d-flex gap-2">
          <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
            @if (saving()) { <span class="spinner-border spinner-border-sm me-1"></span> }
            Guardar
          </button>
          <a routerLink="/admin/paginas" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </div>
    </div>
  }
</div>
