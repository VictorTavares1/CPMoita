<div>
  <div class="d-flex align-items-center gap-3 mb-4">
    <a routerLink="/admin/horarios" class="btn btn-outline-secondary btn-sm">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h4 class="mb-0 fw-semibold">Novo Setor de Horário</h4>
  </div>

  @if (error()) {
    <div class="alert alert-danger py-2 small">{{ error() }}</div>
  }

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">

      <div class="row g-3 mb-3">
        <div class="col-md-9">
          <label class="form-label fw-semibold">Nome do Setor <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="nome" placeholder="Ex: Secretaria">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Ordem</label>
          <input type="number" class="form-control" [(ngModel)]="ordem" min="0">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Entradas de Horário</label>
        <div class="text-muted small mb-2">Define os dias e horários de funcionamento deste setor.</div>

        @for (e of entradas; track trackByIndex($index)) {
          <div class="row g-2 mb-2 align-items-center">
            <div class="col-md-5">
              <input type="text" class="form-control form-control-sm" [value]="e.dia"
                (input)="updateEntrada($index, 'dia', $any($event.target).value)"
                placeholder="Dia (ex: Segunda-feira)">
            </div>
            <div class="col-md-5">
              <input type="text" class="form-control form-control-sm" [value]="e.horario"
                (input)="updateEntrada($index, 'horario', $any($event.target).value)"
                placeholder="Horário (ex: 08:00 - 18:00)">
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-danger btn-sm w-100" type="button" (click)="removeEntrada($index)">
                <i class="fa-solid fa-times"></i>
              </button>
            </div>
          </div>
        }

        <button class="btn btn-outline-secondary btn-sm mt-2" type="button" (click)="addEntrada()">
          <i class="fa-solid fa-plus me-1"></i> Adicionar dia
        </button>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
          @if (saving()) { <span class="spinner-border spinner-border-sm me-1"></span> }
          Criar
        </button>
        <a routerLink="/admin/horarios" class="btn btn-outline-secondary">Cancelar</a>
      </div>

    </div>
  </div>
</div>
